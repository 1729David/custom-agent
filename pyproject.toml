[project]
name = "custom-agent"
version = "0.1.0"
description = "Local AI agent powered by Ollama"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.14.2",
    "httpx>=0.28.1",
    "ollama>=0.4.0",
    "playwright>=1.63.0",
    "pypdf>=6.10.2",
]

[project.scripts]
agent = "main:main"
